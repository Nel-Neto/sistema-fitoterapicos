<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Base de consulta de plantas medicinais e fitoterápicos.">
    <title>{% block title %}Fitoterápicos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('plantas.index') }}">Fitoterápicos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('plantas.index') }}">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('plantas.listar_plantas') }}">Plantas</a></li>
            </ul>
            <form class="d-flex" action="{{ url_for('plantas.buscar') }}" method="get" role="search">
                <input class="form-control me-2" type="search" name="q" placeholder="Nome ou indicação" value="{{ request.args.get('q', '') }}">
                <button class="btn btn-light" type="submit">Buscar</button>
            </form>
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="border-top mt-5 py-4 bg-light">
    <div class="container small text-secondary">
        <strong>Base de Fitoterápicos</strong><br>
        Conteúdo informativo. As informações não substituem avaliação ou orientação de profissional de saúde.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
